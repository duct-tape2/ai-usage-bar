<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1014" media="(prefers-color-scheme: dark)">
<title>AI Usage Bar</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>

<header class="topbar" role="banner">
  <div class="wrap topbar__row">
    <div class="brand">
      <h1 class="brand__name" data-i18n="app.title"></h1>
      <p class="brand__sub" data-i18n="app.subtitle"></p>
    </div>

    <div class="tools">
      <div class="seg" role="group" data-i18n-label="app.theme" id="theme-toggle">
        <button type="button" class="seg__btn" data-theme-mode="auto" aria-pressed="false"
                data-i18n-label="theme.auto" data-i18n-title="theme.auto">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <circle cx="10" cy="10" r="6.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 3.6a6.4 6.4 0 0 1 0 12.8z" fill="currentColor"/>
          </svg>
        </button>
        <button type="button" class="seg__btn" data-theme-mode="light" aria-pressed="false"
                data-i18n-label="theme.light" data-i18n-title="theme.light">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10 1.6v2.2M10 16.2v2.2M18.4 10h-2.2M3.8 10H1.6M15.9 4.1l-1.6 1.6M5.7 14.3l-1.6 1.6M15.9 15.9l-1.6-1.6M5.7 5.7L4.1 4.1"
                  fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="seg__btn" data-theme-mode="dark" aria-pressed="false"
                data-i18n-label="theme.dark" data-i18n-title="theme.dark">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M16.2 12.4A6.9 6.9 0 0 1 7.6 3.8a6.9 6.9 0 1 0 8.6 8.6z"
                  fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <button type="button" class="btn" id="refresh" data-i18n-label="app.refresh">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M16.4 8.6A6.6 6.6 0 1 0 16 12.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M16.8 3.9v4.9h-4.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="btn__text" data-i18n="app.refresh"></span>
      </button>
    </div>
  </div>
</header>

<div class="wrap statusline" role="status" aria-live="polite">
  <p class="updated" id="updated"></p>
  <p class="banner" id="banner" hidden></p>
</div>

<main class="wrap" id="main">
  <section class="hero" id="hero" aria-labelledby="hero-title" hidden>
    <h2 class="sr-only" id="hero-title" data-i18n="app.worst"></h2>
    <div id="hero-body"></div>
  </section>

  <section aria-labelledby="providers-title">
    <h2 class="sr-only" id="providers-title" data-i18n="app.providers"></h2>
    <div class="grid" id="providers" aria-busy="false"></div>
  </section>

  <div class="empty" id="empty" hidden>
    <p class="empty__title" data-i18n="app.empty"></p>
    <p class="empty__hint" data-i18n="app.emptyHint"></p>
  </div>
</main>

</body>
</html>
